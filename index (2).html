<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 白地の明るい画面に固定。Layout: 上部にタブ（面接練習／質問リスト）。面接練習は「はじめる → 面接中 → おわり」の3画面を切り替える。 */
:root{
  --bg:#ffffff; --panel:#f4f7f5; --line:#d9e1dc; --ink:#17201c; --muted:#5d6b64;
  --accent:#2c6a57; --accent-ink:#ffffff; --accent-soft:#e2efe9; --warm:#b4641e; --warm-soft:#fbefe2; --rec:#d83f3f;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:0 48px;margin:0}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto}
/* ヘッダー */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 12px;border-bottom:1px solid var(--line)}
.top .eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6vw,30px);line-height:1.3;margin:2px 0 0}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:8px 18px;border-radius:999px;cursor:pointer;font-size:14.5px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
main{padding-top:24px}
/* 共通部品 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.huge{font-size:19px;padding:16px 34px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.5vw,32px)}
.small{font-size:13px;color:var(--muted)}
.warn{color:var(--warm)}
kbd{font:inherit;font-size:12px;border:1.5px solid currentColor;border-radius:5px;padding:0 6px;opacity:.85;margin-left:4px}
/* はじめる画面 */
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,28px);margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--muted)}
.flow{list-style:none;padding:0;margin:22px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;counter-reset:f}
.flow li{background:var(--panel);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;counter-increment:f;position:relative;padding-top:34px}
.flow li::before{content:counter(f);position:absolute;top:10px;left:14px;font-family:var(--display);font-weight:800;color:var(--accent);font-size:17px}
.flow li b{display:block;font-size:15px}
@media (max-width:640px){.flow{gap:6px}.flow li{font-size:11.5px;padding:28px 8px 9px;line-height:1.45}.flow li::before{left:9px;top:7px}.flow li b{font-size:12.5px}.hero p{font-size:14.5px}}
.setrow{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;margin-top:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted);font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 14px;cursor:pointer;font-size:14.5px;line-height:1.3;text-align:center}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button small{display:block;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[aria-pressed="true"] small{color:#dff0e8}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;padding:8px 0}
.sw input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{left:21px}
.go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
details.more{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:700}
.moregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
.moregrid .wide{grid-column:1/-1}
@media (max-width:560px){.moregrid{grid-template-columns:minmax(0,1fr)}}
.moregrid input,.moregrid select,.moregrid textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%;font-size:15px}
.check{margin-top:14px;background:var(--panel);border-radius:12px;padding:12px 14px;font-size:14px}
.notice{margin-top:16px;font-size:13px;color:var(--muted)}
/* 面接中 */
.run{display:flex;flex-direction:column;gap:18px}
.prog{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:5px;flex:1}
.dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.now{background:var(--accent);opacity:.45}
.prog .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{background:var(--panel);border-radius:var(--r);padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:12px;min-height:200px}
.qtag{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--accent);font-size:14px}
.qtag .num{font-family:var(--display);font-size:26px;line-height:1}
.qtag.follow{color:var(--warm)}
.qtext{font-size:clamp(21px,3.2vw,30px);font-weight:700;line-height:1.55;margin:0;text-wrap:balance}
.who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.who .av{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;position:relative}
.who.talk .av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
.answer{border:2px solid var(--accent);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.answer.idle{border-color:var(--line);opacity:.6}
.ahead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--rec);animation:pulse 1.1s infinite}
.answer.idle .recdot{animation:none;background:var(--line)}
.timer{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;margin-left:auto}
.timer.over{color:var(--warm)}
.tbar{height:8px;border-radius:4px;background:var(--panel);position:relative;overflow:hidden}
.tbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}
.tbar.over i{background:var(--warm)}
.tbar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.3}
.tlabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-6px}
.live{font-size:16px;line-height:1.7;min-height:3.4em;max-height:9em;overflow-y:auto;color:var(--ink)}
.live .interim{color:var(--muted)}
.live:empty::before{content:"話すと、ここに文字が出ます";color:var(--muted)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl .btn.huge{flex:1 1 260px}
/* おわり */
.done h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,28px);margin:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--panel);border-radius:12px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.steps{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:start;border:1.5px solid var(--line);border-radius:14px;padding:16px}
.steps li.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.steps li.ok{opacity:.7}
.steps .n{grid-row:1/3;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px}
.steps li.ok .n{background:var(--accent)}
.steps h3{margin:0;font-size:16.5px}
.steps .body{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14.5px}
.steps .path{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.steps .path span{background:var(--panel);border-radius:6px;padding:2px 9px;font-weight:700;font-size:13.5px}
.steps .path i{font-style:normal;color:var(--muted)}
details.review{margin-top:18px;border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
details.review summary{cursor:pointer;font-weight:700}
.alist{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.aitem{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.aitem .badge{font-family:var(--display);font-weight:800;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.aitem .q{font-weight:700;font-size:14.5px}
.aitem .q small{color:var(--muted);font-weight:400;margin-left:6px}
.aitem textarea{grid-column:2;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;min-height:76px;resize:vertical;font-size:14.5px;line-height:1.6}
.again{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
/* 質問リスト */
.ltools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ltools .count{margin-left:auto;font-size:13.5px;color:var(--muted)}
.lgroup{margin-top:22px}
.lgroup h3{font-size:14px;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:12px 4px;border-top:1px solid var(--line)}
.qitem .badge{font-family:var(--display);font-weight:800;width:36px;height:36px;border-radius:9px;background:var(--panel);display:grid;place-items:center;font-size:17px}
.qitem.sel .badge{background:var(--accent);color:#fff}
.qitem .t{padding-top:5px}
.star{color:var(--warm);font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.qitem input{width:22px;height:22px;accent-color:var(--accent);margin-top:7px;cursor:pointer}
.qitem details{grid-column:2/4;font-size:13.5px;color:var(--muted)}
.qitem summary{cursor:pointer;width:max-content}
.qitem details p{margin:4px 0 0}
.lfoot{position:sticky;bottom:12px;margin-top:20px;display:flex;justify-content:center}
.meter{display:inline-flex;gap:2px;align-items:flex-end;height:18px}
.meter i{width:4px;background:var(--line);border-radius:1px}
.meter i:nth-child(1){height:5px}.meter i:nth-child(2){height:7px}.meter i:nth-child(3){height:9px}.meter i:nth-child(4){height:11px}.meter i:nth-child(5){height:13px}.meter i:nth-child(6){height:15px}.meter i:nth-child(7){height:17px}.meter i:nth-child(8){height:18px}
.meter i.on{background:var(--accent)}
.alert{background:var(--warm-soft);color:#7a3d0a;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.6}
.btn.go{background:var(--ink);border-color:var(--ink)}
@media (max-width:640px){
  .ctl.bar{position:sticky;bottom:0;background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-bottom:-10px;border-top:1px solid var(--line);z-index:5}
  .ctl.bar .btn.huge{flex:1 1 100%;font-size:18px;padding:16px}
  .ctl.bar .btn:not(.huge){flex:1;padding:9px 10px;font-size:14px}
  .qcard{min-height:0;padding:18px}
  .qtext{font-size:21px}
  .answer{padding:14px 16px}
  .timer{font-size:28px}
  .go .btn{flex:1 1 auto}
  .go .btn.huge{flex:1 1 100%}
}
@media (hover:none){ kbd{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const UNIV=`桜美林大学 ビジネスマネジメント学群（2027年度入試）
- 総合型選抜 総合評価方式：1次は書類審査（調査書、自己PRシート 1,200〜1,600字：これまでの学びや活動への取り組みと成功・失敗体験から学んだこと／それを学群での学習や課外活動にどう活かすか／大学卒業後の展望、活動報告書）。2次は面接 約15分（出願書類の内容と、課題図書の内容理解度を確かめる口頭試問）。
- 課題図書：苅谷剛彦『知的複眼思考法 誰でも持っている創造力のスイッチ』（講談社）。細部の暗記より、内容を理解し、筆者の主張に対して自分の意見を持つことが大切。
- 学群の構成：新宿キャンパス。「業種を学ぶ」ビジネスプログラム（国際ビジネス／流通・マーケティングビジネス／観光・ホスピタリティ・エンターテイメントビジネス／エアラインビジネスの4領域。1つを重点的に学びつつ複数の分野にも触れられる）と、「スキルを学ぶ」マネジメントプログラム（経営戦略・管理／会計・財務／経済・法律／経営情報の4科目群）。
- 学びの特色：講義と実習・演習を繰り返す実践型カリキュラム。オンキャンパス実習（学内の旅行カウンターでの旅行販売、学内カフェの企画・運営）、国内外の企業でのインターンシップ、海外ビジネス研修、英語研修とビジネス研修を組み合わせた約4か月の留学（GOプログラム）。
- 大学：キリスト教精神に基づく国際人の育成を建学の精神とし、「学而事人（学びて人に仕える）」を掲げる。人々の暮らしや社会を思いやる視点をビジネスに生かすことを重視。
- アドミッション・ポリシーの要点：基礎学力、自ら進んで学ぶ意欲と自立心、社会の出来事や国・地域・企業の取り組みへの関心、社会と関わりながら課題に挑もうとする人、建学の理念に共感し他者に尽くして共に成長しようとする人。

# 課題図書の主な内容（口頭試問の判定の目安）
- 序章：常識やステレオタイプ、「正解は一つ」という思い込み（単眼思考）にとらわれず、物事を多面的・相対的にとらえ、自分の頭で考える「複眼思考」を身につけることを説く。
- 第1章 創造的読書：著者の言うことをうのみにせず、著者の立場や前提、根拠を確かめ、著者と対話するように批判的に読む。
- 第2章 考えるための書き方：根拠を示し、論理的に書くことで、考える力が鍛えられる。
- 第3章 問いの立て方と展開：「どうなっているのか」（実態）と「なぜ」（原因）を分けて問いを展開し、問いを具体的に分解する。因果関係を考えるときは、見かけだけの関係（疑似相関）や第三の要因に注意する。
- 第4章 複眼思考の実践：物事を関係の中でとらえる見方（関係論的なものの見方）、意図しない結果が生まれる逆説の発見、問題そのものの立てられ方を問う視点（メタの視点）。
受験生の説明がこの内容と大きく食い違う場合は、どこが違うかを具体的に指摘する。細かい用語を正確に言えなくても、趣旨が合っていれば減点しない。`;

/* [グループ, 頻出(1/0), 質問, 見られる点, 答え方] */
const QDATA=[
 ["導入・人物",1,"1分程度で自己紹介をしてください。","話の構成力と第一印象。","名前→高校で力を入れたこと1つ→ビジネスへの関心、で締める。経歴の羅列にしない。"],
 ["導入・人物",0,"高校生活で最も力を入れたことは何ですか。そこから何を学びましたか。","主体性と振り返る力。","行動→困難→工夫→学び。学びを大学での学びにつなげられると強い。"],
 ["導入・人物",0,"あなたの長所と短所を教えてください。","自己理解。","長所は具体例を1つ。短所は改善の工夫まで言う。"],
 ["志望理由",1,"ビジネスや経営に関心を持ったきっかけは何ですか。","動機の原体験。","いつ・どこで・何を見て関心を持ったか。身近な店や企業、アルバイト、探究の経験からでよい。"],
 ["志望理由",1,"数ある経営系の学部の中で、なぜ桜美林大学のビジネスマネジメント学群なのですか。","本学群でなければならない理由。","「業種を学ぶ」ビジネスプログラムと「スキルを学ぶ」マネジメントプログラムの組み合わせ、実践型カリキュラムなど、具体的な特色を自分の目標と結ぶ。"],
 ["志望理由",0,"他の大学の経営学部や商学部と比べて、本学群の違いは何だと考えますか。","調べた深さ。","学内カフェの運営や旅行販売などのオンキャンパス実習、4つの業種領域、海外研修など、比べた上での違いを1〜2点に絞って言う。"],
 ["志望理由",0,"本学は「学而事人（学びて人に仕える）」を掲げています。この考え方は、ビジネスとどうつながると思いますか。","建学の精神への共感。","言葉の意味を自分の言葉で言い、お客さんや地域に役立つビジネスの具体例と結ぶ。"],
 ["志望理由",0,"オープンキャンパスや説明会で印象に残ったことはありますか。","行動力と関心の具体性。","見た・聞いた具体的な場面→感じたこと→志望が強まった理由。"],

/* 出題の組み立て：1番から始めて39番で締める。課題図書（13〜27）は必ず2〜3問以上。 */
function planRandom(total){
  const R=(lo,hi,ex=[])=>shuffle(QS.filter(q=>q.n>=lo&&q.n<=hi&&!ex.includes(q.n)).map(q=>q.n));
  const book=R(14,27);
  const slots=[5,13,book[0],...R(9,12).slice(0,1),...R(28,31).slice(0,1),book[1],...R(32,35).slice(0,1),...R(4,8,[5]).slice(0,1),book[2],...R(36,37).slice(0,1),...R(2,3).slice(0,1),38,book[3]];
  const rest=shuffle(QS.map(q=>q.n).filter(n=>n>1&&n<39&&!slots.includes(n)));
  const mid=[...slots,...rest].slice(0,Math.max(0,total-2));
  return [1,...mid.sort((a,b)=>a-b),39];
}

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function speak(text){

    const fallback=()=>setTimeout(res,Math.min(5000,500+text.length*90));

/* ---------- その場で文字にする（ブラウザの音声認識。音声ファイルは作らない） ---------- */
const stt={r:null,want:false,final:"",interim:"",out:null,err:"",ended:null,active:false,sound:false,stalled:false,ends:[],onstate:null};
const TOUCH=matchMedia("(hover:none)").matches||"ontouchstart" in window;
function sttRender(){ const o=stt.out; if(!o) return; o.textContent=""; if(stt.final) o.append(stt.final); if(stt.interim) o.append(el("span",{class:"interim",text:stt.interim})); o.scrollTop=o.scrollHeight; }
function sttNotify(){ if(stt.onstate) stt.onstate(); }
function sttMake(){
  const r=new SRC(); r.lang="ja-JP"; r.continuous=true; r.interimResults=true; stt.r=r;
  r.onstart=()=>{ stt.active=true; stt.stalled=false; sttNotify(); };
  r.onaudiostart=()=>{ stt.active=true; sttNotify(); };
  r.onspeechstart=()=>{ stt.sound=true; sttNotify(); };
  r.onresult=e=>{ stt.got=true; if(stt.err==="net") stt.err=""; let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) stt.final+=t+"。"; else interim+=t; } stt.interim=interim; sttRender(); sttNotify(); };
  r.onerror=e=>{ const c=e.error;
    if(c==="not-allowed"||c==="service-not-allowed"){ stt.want=false; stt.err=c==="service-not-allowed"?"svc":"mic"; }
    else if(c==="audio-capture"){ stt.want=false; stt.err="cap"; }
    else if(c==="network"){ stt.err="net"; }
    sttNotify(); };
  r.onend=()=>{
    stt.active=false;
    if(stt.interim){ stt.final+=stt.interim+"。"; stt.interim=""; sttRender(); }
    if(stt.want&&stt.r===r){
      const now=Date.now(); stt.ends=stt.ends.filter(t=>now-t<4000); stt.ends.push(now);
      if(stt.ends.length>=3){ stt.stalled=true; sttNotify(); return; }   /* 自動での再開がうまくいかない端末（iPhoneなど） */
      try{ r.start(); }catch(e){ stt.stalled=true; }
      sttNotify();
    } else if(stt.ended){ const f=stt.ended; stt.ended=null; f(); }
  };
  return r;
}
function sttStart(out){   /* 必ずボタンを押した直後に呼ぶ（スマホではタップの中でしか始められない） */
  stt.final=""; stt.interim=""; stt.out=out; stt.want=true; stt.got=false; stt.sound=false; stt.stalled=false; stt.ends=[]; sttRender();
  if(!SRC) return;
  try{ sttMake().start(); }catch(e){ stt.stalled=true; }
  sttNotify();
}
function sttResume(){ if(!SRC||!stt.want) return; stt.ends=[]; stt.stalled=false; try{ sttMake().start(); }catch(e){ stt.stalled=true; } sttNotify(); }
const cleanStt=t=>t.replace(/。{2,}/g,"。").replace(/^\s*。/,"").trim();
function sttStop(){
  return new Promise(res=>{
    const fin=()=>res(cleanStt(stt.final+stt.interim));
    if(!stt.r||!stt.active){ stt.want=false; stt.r=null; fin(); return; }
    stt.want=false; stt.ended=fin;
    try{ stt.r.stop(); }catch(e){ stt.ended=null; fin(); }
    setTimeout(()=>{ if(stt.ended){ stt.ended=null; fin(); } },1800);
  });
}

function buildPrompt(){

  const ns=answered(), d=new Date(state.session?.at||Date.now());
  const crit=CFG.criteria.map((c,i)=>`${i+1}. ${c[0]}（${c[1]}）`).join("\n");
  return `あなたは高校の進路指導で、大学の総合型選抜の面接指導を担当する経験豊富な先生です。
受験生がひとりで行った面接練習について、受験生本人に渡すフィードバックを作ってください。

# 志望先と入試の情報
${UNIV}

# 受験生
- 練習回：${RD||"（未記入）"}
- ${CFG.themeLabel}：${TH||"（未記入）"}

# 練習の方法
練習ページの擬似面接官（合成音声）が質問を読み上げ、受験生が声で答えた。答えはブラウザの音声認識で自動的に文字にしたもので、誤変換や句読点の誤りを含むことがある。誤変換と思われる部分は受験生の誤りとして扱わない。「（深掘り「…」への答え）」とある部分は、面接官の深掘りの問いかけへの答え。回答時間はページで測った秒数。

# 質問と答え
${ns.map(n=>`[${n}番] ${QS[n-1].q}\n回答時間：約${Math.round(state.times[n]||0)}秒\n答え：${state.answers[n].trim()}`).join("\n\n")}

# 評価の観点（この順で5つ）
${crit}

# 書き方の注意
- 答えにないことを推測で事実のように書かない。答えた質問が少なく判断できない観点は、そう述べて点数を控えめにする。
- 受験生本人に「あなた」と語りかける、前向きで具体的な文体。抽象的な励ましだけにしない。
- 改善例は、本人の答えの内容を活かした骨子（2〜3文）にとどめ、丸暗記用の完成原稿にしない。
- 回答時間が90秒を超える答えには、短くする助言を入れる。声の調子や表情は判断しない。
- 答えたすべての質問を読んだうえで、改善が必要な質問を優先して取り上げる。

# 出力のしかた（とても大事）
内容を考えたら、下の「レイアウト指定」どおりのA4縦1枚のPDFファイルを作成し、ダウンロードできる形で出力してください。画面上の文章やCanvasではなく、必ずPDFファイルとして出力してください。

## 作り方のルール
- A4縦（210×297mm）1枚。余白は上下左右12mm。2枚目にはみ出したら、字数を削って必ず1枚に収める。
- 日本語フォント（Noto Sans JP など）を本文・表・グラフのラベルすべてに指定する。★☆◎▲などの記号や絵文字は文字化けしやすいので使わない（点数は数字と棒・塗りつぶした図形で表す）。
- 文字が枠や表のセルからはみ出したり、他の要素と重なったりしないこと。表は列幅を固定し、セル内で折り返す。
- 文字の大きさ：タイトル16pt、見出し11pt、本文8.5〜9pt（7.5pt未満にはしない）。
- 色：基調は深緑（#2C6A57）、薄い緑（#E2EFE9）、改善点と注意だけオレンジ（#B4641E／薄いオレンジ #FBEFE2）、文字は濃いグレー。背景は白。
- グラフは日本語ラベルが文字化けしないように作り、PDFに図として配置する。
- 出力する前に、出来上がりを確認する：1枚に収まっているか、文字化け・重なり・切れがないか。問題があれば直してから出力する。
- 答えの全文は載せない。（ ）内は書き方の指示なので、PDFには残さない。
- ファイル名は「面接フィードバック_${RD||"1回目"}_${d.getMonth()+1}月${d.getDate()}日.pdf」。

## レイアウト指定（上から順に。「左｜右」は2列に並べる）
1. ヘッダー（深緑の帯・白文字）
   左：「面接練習フィードバック」（タイトル）、その下に小さく「${CFG.school}｜${CFG.exam}」
   右：「練習回：${RD||"1回目"}」「実施日：${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日」

2. 総合評価（薄い緑の角丸の枠）
   左：A・B・C・Dの1文字を直径25mmほどの円の中に大きく（40pt前後）。円の下に、Aなら「合格圏」、Bなら「あと一歩」、Cなら「要強化」、Dなら「基礎から」
   右：見出し「総評」と、総評（100字以内）

3. 観点別の評価
   左：レーダーチャート（5角形、約65mm四方）。軸は下の5つの観点（短い名前で可）、目盛りは1〜5点。塗りは薄い緑、線は深緑。各頂点の近くに点数の数字。
   右：表「観点｜点数｜ひとこと」。点数は「4／5」のような数字の横に、5マスのうち点数分を深緑で塗った横棒を添える。ひとことは30字以内。

4. 良かった点｜改善点と次の行動
   左（薄い緑の枠、見出し「良かった点」）：3つまで、各40字以内の箇条書き
   右（薄いオレンジの枠、見出し「改善点 → 次の行動」）：3つまで。各項目は太字の改善点（20字以内）と、その下に「→」で次の行動（40字以内）

5. 質問ごとのアドバイス（見出しの左に深緑の縦線）
   改善が必要な順に4問まで、2列×2段のカード（細い罫線の角丸）。各カード：
   - 1行目（太字）：「◯番」と質問の要約（25字以内）
   - 「直す点」の小さなオレンジのラベル＋35字以内
   - 薄いグレーの帯で「改善例」＋本人の答えを活かした骨子（70字以内）

6. 回答の長さ｜本番に向けて
   左：横棒グラフ「回答の長さ（目安30〜60秒）」。縦に質問番号、横軸は0〜120秒。30〜60秒の範囲を薄い緑の帯で示し、棒は深緑、90秒を超える棒だけオレンジ。棒の右端に秒数。90秒を超える答えがあれば、グラフの下に一言（30字以内）。
   右：見出し「本番で聞かれそうな質問」と、四角いチェック欄つきで4つ（各35字以内）。その下に深緑の線の枠で「次回の重点」（60字以内）。

7. フッター（細い線の下に小さく）：左「結論から話し、根拠と経験で支えよう。」右「面接セルフ練習」

## グラフに使うデータ
- 回答時間（秒）：${ns.map(n=>`${n}番 ${Math.round(state.times[n]||0)}`).join("、")}
- レーダーチャートと表の点数：あなたが付けた5つの観点の点数（1〜5の整数）

PDFファイルのほかには、チャットに「PDFファイルをタップして保存してください。」とだけ書いてください。`;
}

/* ---------- 質問リスト ---------- */
function renderList(){
  const v=$("#vList"); v.textContent="";
  const count=el("span",{class:"count"});
  const pick=list=>{ state.sel=[...new Set(list)].sort((a,b)=>a-b); save(); renderList(); };
  const mid=QS.map(q=>q.n).filter(n=>n!==CFG.first&&n<CFG.last);
  v.append(el("p",{class:"small",style:"margin:0 0 12px",text:"本番で出る可能性がある質問の一覧です。ヒントを開くと、見られる点と答え方のこつが分かります。チェックした質問だけで面接することもできます。"}));
  v.append(el("div",{class:"ltools"},
    el("button",{class:"btn",type:"button",onclick:()=>pick([CFG.first,...shuffle(QS.filter(q=>q.s&&q.n!==CFG.first&&q.n<CFG.last).map(q=>q.n)).slice(0,6),CFG.last])},"★頻出から8問"),
    el("button",{class:"btn",type:"button",onclick:()=>pick([CFG.first,...shuffle(mid).slice(0,6),CFG.last])},"ランダムに8問"),
    el("button",{class:"btn ghost",type:"button",onclick:()=>pick([])},"選択を解除"),count));
  let grp=null, last="";
  for(const q of QS){
    if(q.g!==last){ grp=el("div",{class:"lgroup"},el("h3",{text:q.g})); v.append(grp); last=q.g; }
    const on=state.sel.includes(q.n);
    const cb=el("input",{type:"checkbox","aria-label":`${q.n}番を選ぶ`}); cb.checked=on;
    cb.addEventListener("change",()=>{ pick(on?state.sel.filter(x=>x!==q.n):[...state.sel,q.n]); });
    grp.append(el("div",{class:"qitem"+(on?" sel":"")},el("span",{class:"badge",text:String(q.n)}),el("div",{class:"t"},q.q,q.s?el("span",{class:"star",text:"★頻出"}):null),cb,
      el("details",{},el("summary",{text:"ヒント"}),el("p",{},el("b",{text:"見られる点："}),q.a),el("p",{},el("b",{text:"答え方："}),q.t))));
  }
  count.textContent=`${state.sel.length}問を選択中`;
  v.append(el("div",{class:"lfoot"},el("button",{class:"btn primary huge",type:"button",disabled:state.sel.length?null:"",onclick:()=>{ state.set.src="sel"; save(); setView("practice"); renderIdle(); }},`選んだ${state.sel.length}問で面接する`)));
}

/* ---------- 起動 ---------- */
$("#eyebrow").textContent=`${CFG.school}｜${CFG.exam}　${CFG.format}`;
$("#ttl").textContent=CFG.title;
renderIdle();
</script>
